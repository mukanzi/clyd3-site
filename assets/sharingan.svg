<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Animated Sharingan-inspired eye">
  <defs>
    <radialGradient id="iris" cx="42%" cy="36%" r="64%">
      <stop offset="0" stop-color="#cf3343"/>
      <stop offset="0.45" stop-color="#a61f31"/>
      <stop offset="0.78" stop-color="#74131f"/>
      <stop offset="1" stop-color="#39080e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5968" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#ff5968" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ff5968" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#6e111c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="94" fill="#120205" stroke="#170307" stroke-width="5"/>
  <circle cx="100" cy="100" r="87" fill="url(#iris)" filter="url(#softShadow)"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#160307" stroke-width="5" opacity="0.95"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#1b0408" stroke-width="3" opacity="0.75"/>

  <!-- three tomoe -->
  <g fill="#09090a">
    <g transform="translate(100 35)">
      <circle cx="0" cy="0" r="10"/>
      <path d="M8 0 C24 4 28 14 24 28 C20 17 12 11 1 10 Z"/>
    </g>
    <g transform="rotate(120 100 100) translate(100 35)">
      <circle cx="0" cy="0" r="10"/>
      <path d="M8 0 C24 4 28 14 24 28 C20 17 12 11 1 10 Z"/>
    </g>
    <g transform="rotate(240 100 100) translate(100 35)">
      <circle cx="0" cy="0" r="10"/>
      <path d="M8 0 C24 4 28 14 24 28 C20 17 12 11 1 10 Z"/>
    </g>
  </g>

  <circle cx="100" cy="100" r="24" fill="#160307" opacity="0.8"/>
  <circle cx="100" cy="100" r="16" fill="#050506"/>
  <circle cx="100" cy="100" r="6" fill="#000"/>

  <circle cx="100" cy="100" r="84" fill="url(#glow)"/>
  <ellipse cx="72" cy="57" rx="29" ry="10" fill="#fff" opacity="0.09" transform="rotate(-20 72 57)"/>
</svg>
