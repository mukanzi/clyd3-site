<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Three-blade Mangekyo-inspired symbol">
  <defs>
    <clipPath id="irisClip">
      <circle cx="256" cy="256" r="224"/>
    </clipPath>
    <path id="blade" d="M256 54 C311 61 358 91 389 137 C348 124 307 132 275 157 C238 186 217 226 213 272 C191 232 185 187 197 146 C209 105 230 75 256 54 Z"/>
  </defs>

  <!-- Dominant crimson iris -->
  <circle cx="256" cy="256" r="224" fill="#d00000"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#710000" stroke-width="8" opacity="0.55"/>

  <!-- Three long curved blades, clipped to the iris -->
  <g clip-path="url(#irisClip)" fill="#050505">
    <use href="#blade"/>
    <use href="#blade" transform="rotate(120 256 256)"/>
    <use href="#blade" transform="rotate(240 256 256)"/>
  </g>

  <!-- Re-open the centre so the blades do not merge into a black mass -->
  <circle cx="256" cy="256" r="58" fill="#d00000"/>
  <circle cx="256" cy="256" r="24" fill="#090909"/>
  <circle cx="256" cy="256" r="7" fill="#e60000"/>
</svg>