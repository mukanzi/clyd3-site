<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="The CLYD3 page you requested could not be found. Return home or explore Listening Atlas and FUT Club Intelligence.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2">
  <title>Page Not Found — CLYD3</title>
  <style>
    :root{--paper:#f1efe8;--ink:#111;--soft:#66625b;--line:rgba(17,17,17,.16);--teal:#0d7c78;--crimson:#a63d45}
    @media(prefers-color-scheme:dark){:root{--paper:#101210;--ink:#f0eee7;--soft:#aaa79f;--line:rgba(240,238,231,.16);--teal:#3ba8a2;--crimson:#d05a64}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;overflow-x:hidden}
    main{width:min(980px,100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:clamp(42px,8vw,92px) 0;position:relative}
    .k{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
    h1{margin:18px 0 20px;font-size:clamp(64px,15vw,170px);line-height:.82;letter-spacing:-.07em;font-weight:500}
    h1 em{font-family:Georgia,serif;font-weight:400;color:var(--crimson)}
    p{max-width:620px;color:var(--soft);font-size:16px;line-height:1.65}
    nav{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px}a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:4px}
    a:hover,a:focus-visible{color:var(--teal)}.signal{position:absolute;right:0;top:42px;width:120px;aspect-ratio:1;border:1px solid var(--line);border-radius:50%}
    .signal:before,.signal:after{content:"";position:absolute;left:50%;top:50%;background:var(--line);transform:translate(-50%,-50%)}.signal:before{width:130%;height:1px}.signal:after{width:1px;height:130%}
    @media(max-width:620px){.signal{display:none}}
  </style>
</head>
<body>
  <main>
    <div class="signal" aria-hidden="true"></div>
    <div class="k">ERROR / 404 / SIGNAL LOST</div>
    <h1>Page <em>not found.</em></h1>

      <a href="/fut/">FUT Intelligence</a>
      <a href="https://github.com/mukanzi">GitHub</a>
    </nav>

</body>
</html>
